<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance-PK // Lite Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --background: #0A0E1A; --primary: #F59E0B; --secondary: #06B6D4; }
        body { background-color: var(--background); color: #cbd5e1; font-family: 'Inter', sans-serif; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .glass { background: rgba(13, 18, 33, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .pulse { animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="flex h-screen">

    <!-- 1. SIDEBAR -->
    <aside class="w-16 md:w-20 flex flex-col items-center py-8 border-r border-slate-800/50 bg-[#0D1221] shrink-0">
        <div class="p-2 mb-10 bg-amber-500/10 rounded-xl border border-amber-500/20">
            <i data-lucide="shield" class="w-6 h-6 text-amber-500"></i>
        </div>
        <nav class="flex flex-col gap-10">
            <i data-lucide="radio" class="w-5 h-5 text-amber-500 cursor-pointer"></i>
            <i data-lucide="activity" class="w-5 h-5 text-slate-500 hover:text-cyan-400 cursor-pointer"></i>
            <i data-lucide="database" class="w-5 h-5 text-slate-500 hover:text-cyan-400 cursor-pointer"></i>
            <i data-lucide="message-square" class="w-5 h-5 text-slate-500 hover:text-cyan-400 cursor-pointer"></i>
        </nav>
        <div class="mt-auto flex flex-col gap-8">
            <i data-lucide="settings" class="w-5 h-5 text-slate-600 hover:text-white cursor-pointer"></i>
            <i data-lucide="log-out" class="w-5 h-5 text-slate-600 hover:text-red-400 cursor-pointer"></i>
        </div>
    </aside>

    <!-- 2. MAIN CONTENT AREA (Feed + Chat) -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="p-6 border-b border-slate-800/50 flex justify-between items-center bg-[#0A0E1A]/80 backdrop-blur-md">
            <div>
                <h1 class="text-lg font-bold text-white flex items-center gap-2 font-mono">VIGILANCE-PK <span class="text-[9px] bg-amber-500/20 text-amber-500 px-1.5 py-0.5 rounded uppercase">Lite</span></h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Live Intelligence Stream</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 border border-green-500/20">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full pulse"></div>
                    <span class="text-[9px] font-mono text-green-500 uppercase tracking-tighter">System_Online</span>
                </div>
                <button onclick="fetchFeed()" class="p-2 rounded-lg bg-slate-800/50 border border-slate-700 hover:border-amber-500/50 transition-all">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-400"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Panels Container -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- LEFT PANEL: Incident Feed -->
            <div class="w-[450px] border-r border-slate-800/50 flex flex-col bg-[#080B14]">
                <div id="feed-container" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                    <!-- Cards will be injected here -->
                    <div class="h-full flex items-center justify-center opacity-20">
                        <p class="font-mono text-xs italic tracking-widest">[ SYNCHRONIZING_PIPELINE ]</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: Analytical Nexus (Chat) -->
            <div class="flex-1 flex flex-col bg-[#0A0E1A]">
                <div id="chat-container" class="flex-1 overflow-y-auto p-8 space-y-6 custom-scrollbar">
                    <div class="h-full flex flex-col items-center justify-center text-center opacity-30">
                        <i data-lucide="terminal" class="w-10 h-10 mb-4 text-cyan-500"></i>
                        <h3 class="font-mono text-sm uppercase tracking-widest mb-1 text-white">Analytical Nexus</h3>
                        <p class="text-[10px] font-mono max-w-[200px] uppercase">Query the repository for real-time inference...</p>
                    </div>
                </div>

                <!-- Input Area -->
                <footer class="p-6 border-t border-slate-800/50 bg-[#0D1221]">
                    <div class="max-w-3xl mx-auto relative">
                        <input id="chat-input" type="text" placeholder="Initiate analysis query..." 
                               class="w-full bg-[#121829] border border-slate-700 rounded-xl px-5 py-4 text-sm focus:outline-none focus:border-amber-500/40 text-white transition-all">
                        <button onclick="handleChat()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 bg-amber-500 text-black rounded-lg hover:bg-amber-600 transition-all">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </footer>
            </div>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // 1. Fetch Intelligence Feed
        async function fetchFeed() {
            const container = document.getElementById('feed-container');
            try {
                const res = await fetch('http://localhost:8000/feed');
                const data = await res.json();
                
                container.innerHTML = data.map(item => {
                    const title = item.document.split('\n')[0];
                    const source = item.metadata.source || 'Intel';
                    return `
                        <div class="p-4 rounded-xl border border-slate-800/50 bg-[#0D1221]/40 hover:border-amber-500/30 transition-all cursor-pointer group">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[9px] font-mono text-cyan-400 uppercase tracking-widest">${source}</span>
                                <span class="text-[9px] text-slate-600 font-mono uppercase tracking-widest">31 MAR</span>
                            </div>
                            <h3 class="text-sm font-medium text-slate-200 leading-snug group-hover:text-white transition-colors">${title}</h3>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = `<p class="text-xs text-red-500 font-mono p-4">PIPELINE_ERROR: ${err.message}</p>`;
            }
        }

        // 2. Handle Analytical Chat
        async function handleChat() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const query = input.value.trim();
            if (!query) return;

            if (container.querySelector('.opacity-30')) container.innerHTML = '';

            const assistantId = 'msg-' + Date.now();
            const sourceId = 'src-' + Date.now();
            
            // User Message
            container.insertAdjacentHTML('beforeend', `
                <div class="flex justify-end mb-6">
                    <div class="max-w-[80%] p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-50 text-sm">
                        ${query}
                    </div>
                </div>
            `);

            // Assistant Placeholder
            container.insertAdjacentHTML('beforeend', `
                <div class="flex flex-col gap-2 items-start mb-6">
                    <div id="${sourceId}" class="flex gap-2 flex-wrap"></div>
                    <div id="${assistantId}" class="max-w-[90%] p-5 rounded-2xl bg-slate-900/50 border border-slate-800 text-slate-300 text-sm leading-relaxed whitespace-pre-wrap">
                        <span class="animate-pulse">Thinking...</span>
                    </div>
                </div>
            `);
            
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                const bubble = document.getElementById(assistantId);
                const sourceContainer = document.getElementById(sourceId);
                bubble.innerHTML = '';
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const parsed = JSON.parse(line);
                            if (parsed.type === 'status') {
                                bubble.innerHTML = `<span class="animate-pulse text-amber-500/80 font-mono text-[10px] uppercase tracking-widest">${parsed.data}</span>`;
                            }
                            if (parsed.type === 'sources' && sourceContainer) {
                                sourceContainer.innerHTML = parsed.data.slice(0,3).map(s => `
                                    <a href="${s.link || '#'}" target="_blank" class="px-2 py-1 rounded bg-cyan-500/10 border border-cyan-500/20 text-[10px] font-mono text-cyan-500 uppercase hover:bg-cyan-500/20 transition-all">
                                        ${s.source || 'Intel'} // READ_REPORT
                                    </a>
                                `).join('');
                            }
                            if (parsed.type === 'content') {
                                if (fullText === '') bubble.innerHTML = ''; // Clear status on first content
                                fullText += parsed.data;
                                bubble.innerText = fullText;
                                container.scrollTop = container.scrollHeight;
                            }
                        } catch (e) { console.error(e); }
                    }
                }
            } catch (err) {
                document.getElementById(assistantId).innerHTML = `<span class="text-red-400 font-mono text-xs">CRITICAL_ERROR: ${err.message}</span>`;
            }
        }

        // Initial Load
        fetchFeed();
        
        // Allow "Enter" to send
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChat();
        });
    </script>
</body>
</html>
