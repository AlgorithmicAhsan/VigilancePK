<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance-PK</title>
    <!--
        No build step and no third-party requests (ADR-026). Plain files,
        loaded as classic scripts so the page also works opened from disk.
    -->
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <!-- ===== Sign-in ===== -->
    <div id="login-view" class="login" hidden>
        <form id="login-form" class="login-card">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <div>
                    <h1>Vigilance-PK</h1>
                    <p>Sign in to continue</p>
                </div>
            </div>
            <div class="field">
                <label for="login-username">Username</label>
                <input id="login-username" class="input" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <input id="login-password" class="input" type="password" autocomplete="current-password" required>
            </div>
            <p id="login-error" class="form-error" role="alert"></p>
            <button id="login-btn" class="btn btn-primary" type="submit">Sign in</button>
        </form>
    </div>

    <!-- ===== App ===== -->
    <div id="app" class="app" hidden>
        <header class="topbar">
            <div class="brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <div>
                    <h1>Vigilance-PK</h1>
                    <p>Human rights news triage for Pakistan</p>
                </div>
            </div>
            <nav class="nav" aria-label="Sections">
                <a href="#reports" data-view="reports">Reports</a>
                <a href="#lists" data-view="lists">Lists</a>
            </nav>
            <div class="actions">
                <span id="conn" class="conn" data-state="checking" role="status"><span class="dot"></span><span id="conn-label">Checking…</span></span>
                <button id="status-btn" class="btn btn-small" type="button">Status</button>
                <span id="who" class="who"></span>
                <button id="signout-btn" class="btn btn-small" type="button">Sign out</button>
            </div>
        </header>

        <!-- Reports: feed + chat -->
        <main id="view-reports" class="layout">
            <section class="panel feed" aria-labelledby="feed-title">
                <div class="panel-head">
                    <h2 id="feed-title">Latest reports</h2>
                    <span><span id="feed-count" class="muted"></span> <button id="feed-refresh" class="btn btn-small" type="button">Refresh</button></span>
                </div>
                <ol id="feed-list" class="feed-list">
                    <li class="empty">Loading reports…</li>
                </ol>
            </section>

            <section class="panel chat" aria-labelledby="chat-title">
                <div class="panel-head">
                    <h2 id="chat-title">Ask the repository</h2>
                </div>
                <div id="chat-log" class="chat-log">
                    <div id="chat-inner" class="chat-inner" aria-live="polite">
                        <div id="chat-intro" class="intro">
                            <p>Answers use only the reports stored here, and cite the source of each claim.</p>
                            <div class="suggestions">
                                <button class="btn" type="button" data-q="Summarize recent reports of enforced disappearances">Enforced disappearances</button>
                                <button class="btn" type="button" data-q="What violence against religious minorities has been reported recently?">Violence against minorities</button>
                                <button class="btn" type="button" data-q="Are there reports of custodial torture or deaths in police custody?">Custodial torture</button>
                            </div>
                        </div>
                    </div>
                </div>
                <form id="chat-form" class="composer">
                    <div class="composer-inner">
                        <label for="chat-input" class="sr-only">Your question</label>
                        <input id="chat-input" class="input" type="text" maxlength="2000" autocomplete="off"
                               placeholder="Ask about the reports, e.g. protests in Balochistan">
                        <button id="send-btn" class="btn btn-primary" type="submit">Ask</button>
                    </div>
                </form>
            </section>
        </main>

        <!-- Lists: everything the pipeline reads, editable without code -->
        <main id="view-lists" class="lists" hidden>
            <nav class="kinds" aria-label="Lists">
                <h2>Lists</h2>
                <div id="kind-nav"></div>
            </nav>
            <section class="list-main" aria-labelledby="list-title">
                <div class="list-head">
                    <div>
                        <h2 id="list-title">Newspapers</h2>
                        <p id="list-help"></p>
                    </div>
                    <div class="btns admin-only">
                        <button id="import-btn" class="btn" type="button">Import HRMS Excel</button>
                        <button id="add-btn" class="btn btn-primary" type="button">Add entry</button>
                        <input id="import-file" type="file" accept=".xlsx" hidden>
                    </div>
                </div>
                <div id="list-notice" class="notice" role="status" hidden>
                    <div id="list-notice-text"></div>
                    <button id="list-notice-close" type="button" aria-label="Dismiss">✕</button>
                </div>
                <div class="toolbar">
                    <label for="list-search" class="sr-only">Search</label>
                    <input id="list-search" class="input" type="search" placeholder="Search names">
                    <label class="check"><input id="show-inactive" type="checkbox"> Show inactive</label>
                    <span id="list-count" class="muted"></span>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead id="list-thead"></thead>
                        <tbody id="list-tbody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <dialog id="status-dialog" aria-labelledby="status-title">
        <h2 id="status-title">System status</h2>
        <dl id="status-list" class="status"></dl>
        <form method="dialog" class="row"><button class="btn" type="submit">Close</button></form>
    </dialog>

    <dialog id="entry-dialog" aria-labelledby="entry-title">
        <form id="entry-form">
            <h2 id="entry-title">Edit entry</h2>
            <div id="entry-fields"></div>
            <label class="check"><input id="entry-active" type="checkbox"> Active (used by the pipeline)</label>
            <p id="entry-error" class="form-error" role="alert"></p>
            <div class="row">
                <button id="entry-cancel" class="btn" type="button">Cancel</button>
                <button id="entry-save" class="btn btn-primary" type="submit">Save</button>
            </div>
        </form>
    </dialog>

    <script src="app.js"></script>
    <script src="reports.js"></script>
    <script src="lists.js"></script>
</body>
</html>
