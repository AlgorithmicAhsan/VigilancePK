<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigilance-PK // Lite Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --background: #0A0E1A; --primary: #F59E0B; --secondary: #06B6D4; }
        body { background-color: var(--background); color: #cbd5e1; font-family: 'Inter', sans-serif; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .glass { background: rgba(13, 18, 33, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .pulse { animation: pulse-green 2s infinite; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 2s linear infinite;
        }
        #hud-modal { display: none; }
        .hud-content { 
            background: rgba(13, 18, 33, 0.9); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 20px rgba(245, 158, 11, 0.1);
        }
    </style>
</head>
<body class="flex h-screen selection:bg-amber-500/30">

    <!-- CUSTOM HUD MODAL -->
    <div id="hud-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-6">
        <div class="hud-content max-w-md w-full p-8 rounded-2xl border border-amber-500/30 animate-in fade-in zoom-in duration-300">
            <div class="flex items-center gap-3 mb-6 border-b border-slate-800 pb-4">
                <i data-lucide="shield" class="w-5 h-5 text-amber-500"></i>
                <h2 id="hud-title" class="font-mono text-sm uppercase tracking-[0.2em] text-white">System_Status</h2>
            </div>
            <div id="hud-body" class="font-mono text-[11px] text-slate-300 leading-relaxed whitespace-pre-wrap uppercase tracking-wider mb-8">
                <!-- Content injected here -->
            </div>
            <button onclick="closeHUD()" class="w-full py-3 bg-amber-500 text-black font-bold rounded-xl hover:bg-amber-400 transition-all uppercase tracking-widest text-xs">Acknowledge</button>
        </div>
    </div>

    <!-- 1. SIDEBAR -->
    <aside class="w-16 md:w-20 flex flex-col items-center py-8 border-r border-slate-800/50 bg-[#0D1221] shrink-0">
        <div class="p-2 mb-10 bg-amber-500/10 rounded-xl border border-amber-500/20">
            <i data-lucide="shield" class="w-6 h-6 text-amber-500"></i>
        </div>
        <nav class="flex flex-col gap-10">
            <button id="sync-btn" title="Sync Intel" class="focus:outline-none">
                <i data-lucide="radio" class="w-5 h-5 text-amber-500 cursor-pointer"></i>
            </button>
            <button id="activity-btn" title="System Health" class="focus:outline-none">
                <i data-lucide="activity" class="w-5 h-5 text-slate-500 hover:text-cyan-400 cursor-pointer"></i>
            </button>
            <button id="db-btn" title="Repository Stats" class="focus:outline-none">
                <i data-lucide="database" class="w-5 h-5 text-slate-500 hover:text-cyan-400 cursor-pointer"></i>
            </button>
            <button id="chat-tab-btn" title="Analytical Nexus" class="focus:outline-none">
                <i data-lucide="message-square" class="w-5 h-5 text-slate-500 hover:text-cyan-400 cursor-pointer"></i>
            </button>
        </nav>
        <div class="mt-auto flex flex-col gap-8">
            <button id="settings-btn" title="Configuration" class="focus:outline-none">
                <i data-lucide="settings" class="w-5 h-5 text-slate-600 hover:text-white cursor-pointer"></i>
            </button>
            <i data-lucide="log-out" class="w-5 h-5 text-slate-600 hover:text-red-400 cursor-pointer"></i>
        </div>
    </aside>

    <!-- 2. MAIN CONTENT AREA (Feed + Chat) -->
    <main class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="p-6 border-b border-slate-800/50 flex justify-between items-center bg-[#0A0E1A]/80 backdrop-blur-md">
            <div>
                <h1 class="text-lg font-bold text-white flex items-center gap-2 font-mono">VIGILANCE-PK <span class="text-[9px] bg-amber-500/20 text-amber-500 px-1.5 py-0.5 rounded uppercase">Lite</span></h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">Live Intelligence Stream</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-500/10 border border-slate-500/20">
                    <div id="status-dot" class="w-1.5 h-1.5 bg-slate-500 rounded-full"></div>
                    <span id="status-label" class="text-[9px] font-mono text-slate-500 uppercase tracking-tighter">Checking...</span>
                </div>
                <button onclick="handleSync()" title="Run Pipeline" class="p-2 rounded-lg bg-slate-800/50 border border-slate-700 hover:border-amber-500/50 transition-all">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-400"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Panels Container -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- LEFT PANEL: Incident Feed -->
            <div class="w-[450px] border-r border-slate-800/50 flex flex-col bg-[#080B14]">
                <div id="feed-container" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                    <!-- Cards will be injected here -->
                    <div class="h-full flex items-center justify-center opacity-20">
                        <p class="font-mono text-xs italic tracking-widest animate-pulse">[ ANALYZING_VAULT ]</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL: Analytical Nexus (Chat) -->
            <div class="flex-1 flex flex-col bg-[#0A0E1A]">
                <div id="chat-container" class="flex-1 overflow-y-auto p-8 space-y-6 custom-scrollbar">
                    <div id="chat-intro" class="h-full flex flex-col items-center justify-center text-center">
                        <div class="opacity-30 flex flex-col items-center">
                            <i data-lucide="terminal" class="w-10 h-10 mb-4 text-cyan-500"></i>
                            <h3 class="font-mono text-sm uppercase tracking-widest mb-1 text-white">Analytical Nexus</h3>
                            <p class="text-[10px] font-mono max-w-[200px] uppercase mb-8">Query the repository for real-time inference...</p>
                        </div>
                        
                        <div class="space-y-2 max-w-xs opacity-50 hover:opacity-100 transition-opacity">
                            <div class="text-[8px] uppercase tracking-widest text-cyan-500 mb-2">Suggested Inquiries</div>
                            <div class="grid grid-cols-1 gap-2">
                                <button onclick="document.getElementById('chat-input').value='Analyze recent religious minority violations in Punjab'; handleChat()" class="text-left p-2 rounded border border-white/5 bg-white/5 hover:bg-cyan-500/10 text-[9px] font-mono transition-colors">/ RELIGIOUS_MINORITY_AUDIT</button>
                                <button onclick="document.getElementById('chat-input').value='Summarize reports regarding enforced disappearances'; handleChat()" class="text-left p-2 rounded border border-white/5 bg-white/5 hover:bg-cyan-500/10 text-[9px] font-mono transition-colors">/ DISAPPEARANCE_TRACKER</button>
                                <button onclick="document.getElementById('chat-input').value='Provide a summary of legislative updates'; handleChat()" class="text-left p-2 rounded border border-white/5 bg-white/5 hover:bg-cyan-500/10 text-[9px] font-mono transition-colors">/ LEGISLATIVE_SUMMARY</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <footer class="p-6 border-t border-slate-800/50 bg-[#0D1221]">
                    <div class="max-w-3xl mx-auto relative">
                        <input id="chat-input" type="text" placeholder="Initiate analysis query..." 
                               class="w-full bg-[#121829] border border-slate-700 rounded-xl px-5 py-4 text-sm focus:outline-none focus:border-amber-500/40 text-white transition-all">
                        <button id="send-btn" onclick="handleChat()" class="absolute right-3 top-1/2 -translate-y-1/2 p-2 bg-amber-500 text-black rounded-lg hover:bg-amber-600 transition-all">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </footer>
            </div>
        </div>
    </main>

    <script>
        // --- Core Intelligence Logic ---
        lucide.createIcons();

        // Single place to point the dashboard at its backend.
        // Change this to your deployed API before publishing the page.
        const API_BASE = 'http://localhost:8000';

        // Monotonic id source for chat turns.
        let messageCounter = 0;

        // --- Untrusted-content helpers ---------------------------------
        // Everything rendered in the feed originates in third-party RSS, and
        // RSS summaries routinely carry HTML. Anything interpolated into an
        // innerHTML template must go through esc(); anything used as a URL
        // must go through safeUrl().
        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Only http(s) survives. Blocks javascript:, data: and friends
        // arriving via a feed <link> or a compromised source.
        function safeUrl(value) {
            const raw = String(value ?? '').trim();
            if (!raw) return '';
            try {
                const url = new URL(raw, window.location.href);
                return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '';
            } catch (e) {
                return '';
            }
        }

        async function loadFeed() {
            const container = document.getElementById('feed-container');
            try {
                const res = await fetch(`${API_BASE}/feed`);
                if (!res.ok) throw new Error(`API returned ${res.status}`);
                const data = await res.json();

                if (Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(item => {
                        const doc = String(item.document || '');
                        const title = esc(doc.split('\n')[0]);
                        const summary = esc(doc.split('\n').slice(1,3).join(' ') || 'No summary available.');
                        const meta = item.metadatas || {};
                        const source = esc(meta.source || 'INTEL');
                        const category = esc(meta.category || 'GENERAL');
                        const severity = String(meta.severity || 'medium').toLowerCase();
                        const date = esc(meta.published ? meta.published.slice(5,11) : 'UNDATED');

                        const borderMap = { critical: 'border-l-red-500', high: 'border-l-amber-500', medium: 'border-l-cyan-500', low: 'border-l-slate-500' };
                        const borderColor = borderMap[severity] || 'border-l-cyan-500';

                        return `
                            <div class="group p-4 rounded-xl bg-slate-900/40 border border-slate-800/50 ${borderColor} border-l-4 hover:bg-slate-800/60 hover:border-slate-700 transition-all duration-300 cursor-pointer mb-4">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-[10px] font-bold text-cyan-500 font-mono tracking-tighter uppercase">
                                        ${source} <span class="text-slate-600 mx-1">//</span> ${category}
                                    </span>
                                    <span class="text-[9px] text-slate-600 font-mono uppercase tracking-widest">${date}</span>
                                </div>
                                <h3 class="text-sm font-semibold text-slate-100 leading-snug group-hover:text-amber-400 transition-colors mb-2 line-clamp-2">${title}</h3>
                                <p class="text-[11px] text-slate-400 leading-relaxed line-clamp-2 opacity-80 group-hover:opacity-100 transition-opacity">${summary}</p>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = `<div class="h-full flex items-center justify-center text-slate-600 font-mono text-[10px] uppercase italic tracking-widest mt-20">[ VAULT_EMPTY // RUN_SYNC ]</div>`;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-xs text-red-500 font-mono p-4">PIPELINE_ERROR: ${esc(err.message)}</p>`;
            }
        }

        async function handleChat() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-container');
            const query = input.value.trim();
            if (!query) return;

            const intro = document.getElementById('chat-intro');
            if (intro) intro.remove();
            // A counter, not Date.now(): two messages sent in the same
            // millisecond used to collide on the same element id.
            const turn = ++messageCounter;
            const assistantId = 'msg-' + turn;
            const sourceId = 'src-' + turn;

            container.insertAdjacentHTML('beforeend', `<div class="flex justify-end mb-6"><div class="max-w-[80%] p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-50 text-sm">${esc(query)}</div></div>`);
            container.insertAdjacentHTML('beforeend', `<div class="flex flex-col gap-2 items-start mb-6"><div id="${sourceId}" class="flex gap-2 flex-wrap"></div><div id="${assistantId}" class="max-w-[90%] p-5 rounded-2xl bg-slate-900/50 border border-slate-800 text-slate-300 text-sm leading-relaxed whitespace-pre-wrap"><span class="animate-pulse">Thinking...</span></div></div>`);
            
            input.value = '';
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch(`${API_BASE}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) });
                if (!response.ok) {
                    const problem = await response.json().catch(() => ({}));
                    throw new Error(problem.detail || `API returned ${response.status}`);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '', buffer = "";
                const bubble = document.getElementById(assistantId);
                const sourceContainer = document.getElementById(sourceId);
                bubble.innerHTML = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const parsed = JSON.parse(line);
                            if (parsed.type === 'status') bubble.innerHTML = `<span class="animate-pulse text-amber-500/80 font-mono text-[10px] uppercase tracking-widest">${esc(parsed.data)}</span>`;
                            if (parsed.type === 'sources' && sourceContainer) {
                                // Source name and link both come from the feed, so both are sanitised.
                                sourceContainer.innerHTML = (parsed.data || []).slice(0,3).map(s => {
                                    const href = safeUrl(s.link);
                                    const label = esc(s.source || 'Intel');
                                    const classes = "px-2 py-1 rounded bg-cyan-500/10 border border-cyan-500/20 text-[10px] font-mono text-cyan-500 uppercase hover:bg-cyan-500/20 transition-all";
                                    return href
                                        ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" class="${classes}">${label} // READ_REPORT</a>`
                                        : `<span class="${classes} opacity-60">${label} // NO_LINK</span>`;
                                }).join('');
                            }
                            if (parsed.type === 'content') {
                                if (fullText === '') bubble.innerHTML = '';
                                fullText += parsed.data;
                                bubble.innerText = fullText;
                                container.scrollTop = container.scrollHeight;
                            }
                        } catch (e) { console.error(e); }
                    }
                }
            } catch (err) {
                document.getElementById(assistantId).innerHTML = `<span class="text-red-400 font-mono text-xs">CRITICAL_ERROR: ${esc(err.message)}</span>`;
            }
        }

        // Guards against two sync polls running at once. The header refresh
        // button and the sidebar button both land here, and only the sidebar
        // one used to be disabled during a run.
        let syncInterval = null;
        let isSyncing = false;

        async function handleSync() {
            if (isSyncing) return;

            const btn = document.getElementById('sync-btn');
            const icon = btn?.querySelector('i');
            const feedContainer = document.getElementById('feed-container');

            isSyncing = true;
            if (icon) icon.classList.add('animate-spin-slow');
            if (btn) btn.disabled = true;

            const finish = () => {
                if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
                isSyncing = false;
                if (icon) icon.classList.remove('animate-spin-slow');
                if (btn) btn.disabled = false;
            };

            feedContainer.innerHTML = `<div class="h-full flex items-center justify-center text-[10px] text-amber-500 font-mono uppercase tracking-[0.3em] animate-pulse mt-20">[ INITIALIZING_INGESTION ]</div>`;

            try {
                const res = await fetch(`${API_BASE}/sync?wipe=true`);
                if (!res.ok) throw new Error(`API returned ${res.status}`);
                await res.json();

                // Polling loop. The pipeline writes in batches, so a card
                // appearing does not mean it has finished - we keep polling
                // until the record count stops growing.
                let attempts = 0;
                let lastCount = -1;
                let stableTicks = 0;

                syncInterval = setInterval(async () => {
                    attempts++;
                    await loadFeed();
                    const count = feedContainer.querySelectorAll('.group').length;

                    if (count > 0 && count === lastCount) {
                        stableTicks++;
                    } else {
                        stableTicks = 0;
                    }
                    lastCount = count;

                    // Settled (count unchanged over two checks) or timed out at 3 min.
                    if (stableTicks >= 2 || attempts > 18) {
                        finish();
                    }
                }, 10000); // Check every 10 seconds

            } catch (err) {
                finish();
                feedContainer.innerHTML = `<div class="h-full flex items-center justify-center text-[10px] text-red-500 font-mono uppercase tracking-[0.2em] mt-20 px-4 text-center">[ SYNC_FAILED ]<br><span class="text-slate-500 normal-case tracking-normal">${esc(err.message)}</span></div>`;
            }
        }

        // --- HUD Logic ---
        function showHUD(title, content) {
            document.getElementById('hud-title').innerText = title;
            document.getElementById('hud-body').innerText = content;
            document.getElementById('hud-modal').style.display = 'flex';
        }
        function closeHUD() { document.getElementById('hud-modal').style.display = 'none'; }

        // --- Event Listeners ---
        // Every value below is measured or read from the API. Nothing here is
        // a placeholder: an intelligence tool that invents its own status
        // readings cannot be trusted about anything else either.
        document.getElementById('activity-btn').addEventListener('click', async () => {
            const started = performance.now();
            try {
                const res = await fetch(`${API_BASE}/stats`);
                const latency = Math.round(performance.now() - started);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                showHUD("SYSTEM_HEALTH", [
                    `API_STATUS: ${data.status || 'UNKNOWN'}`,
                    `ROUND_TRIP: ${latency}ms`,
                    `ENDPOINT: ${API_BASE}`,
                    `INFERENCE_ENGINE: ${data.engine || 'UNKNOWN'}`,
                    `GEMINI_KEY: ${data.gemini_key_configured ? 'CONFIGURED' : 'NOT CONFIGURED'}`
                ].join('\n'));
            } catch (e) {
                const latency = Math.round(performance.now() - started);
                showHUD("SYSTEM_HEALTH", `API_STATUS: UNREACHABLE\nFAILED_AFTER: ${latency}ms\nENDPOINT: ${API_BASE}\nDETAIL: ${e.message}`);
            }
        });
        document.getElementById('db-btn').addEventListener('click', async () => {
            try {
                const res = await fetch(`${API_BASE}/stats`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                showHUD("REPOSITORY_STATS", `TOTAL_RECORDS: ${data.total_logs}\nSTATUS: ${data.status || 'UNKNOWN'}\nSTORAGE: CHROMADB_VECTOR_VAULT`);
            } catch (e) { showHUD("ERROR", `DATABASE_ERROR: COULD NOT CONNECT TO VAULT.\nDETAIL: ${e.message}`); }
        });
        document.getElementById('settings-btn').addEventListener('click', async () => {
            try {
                const res = await fetch(`${API_BASE}/stats`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                showHUD("SYSTEM_CONFIGURATION", [
                    `ACTIVE_MODEL: ${data.engine}`,
                    `INFERENCE_MODE: STREAMING`,
                    `GEMINI_KEY: ${data.gemini_key_configured ? 'CONFIGURED' : 'NOT CONFIGURED'}`,
                    `API_ENDPOINT: ${API_BASE}`
                ].join('\n'));
            } catch (e) { showHUD("ERROR", `CONFIG_ERROR: COULD NOT FETCH SYSTEM SETTINGS.\nDETAIL: ${e.message}`); }
        });

        document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
        document.getElementById('sync-btn').addEventListener('click', handleSync);
        document.getElementById('chat-tab-btn').addEventListener('click', () => { document.getElementById('chat-input').focus(); });

        // The header badge reflects a real reachability check, not a constant.
        async function refreshConnectionBadge() {
            const dot = document.getElementById('status-dot');
            const label = document.getElementById('status-label');
            if (!dot || !label) return;
            try {
                const res = await fetch(`${API_BASE}/stats`);
                if (!res.ok) throw new Error('unreachable');
                dot.className = 'w-1.5 h-1.5 bg-green-500 rounded-full pulse';
                label.className = 'text-[9px] font-mono text-green-500 uppercase tracking-tighter';
                label.textContent = 'System_Online';
                label.parentElement.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 border border-green-500/20';
            } catch (e) {
                dot.className = 'w-1.5 h-1.5 bg-red-500 rounded-full';
                label.className = 'text-[9px] font-mono text-red-500 uppercase tracking-tighter';
                label.textContent = 'API_Offline';
                label.parentElement.className = 'flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 border border-red-500/20';
            }
        }

        // Initial Load
        loadFeed();
        refreshConnectionBadge();
    </script>
</body>
</html>
